[package]
name = "autonomous_navigation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "autonav"
path = "src/main.rs"

[[bin]]
name = "cruise_design"
path = "src/bin/cruise_design.rs"

[[bin]]
name = "cruise_operations"
path = "src/bin/cruise_operations.rs"

[[bin]]
name = "proximity_ops"
path = "src/bin/proximity_ops.rs"

[[bin]]
name = "proximity_mission"
path = "src/bin/proximity_mission.rs"

[[bin]]
name = "mission"
path = "src/bin/mission.rs"

[dependencies]
nalgebra      = { workspace = true }
ode_solvers   = "0.4"
rand          = "0.8"
rand_distr    = "0.4"
rayon         = "1"
orbital_models   = { path = "../../crates/orbital_models" }
orbital_math     = { path = "../../crates/orbital_math" }
ephemeris        = { path = "../../crates/ephemeris" }
attitude_control = { path = "../../crates/attitude_control" }
