[package]
name = "mission_planner"
version = "0.1.0"
edition = "2021"

[lib]
name = "mission_planner"
path = "src/lib.rs"

[[bin]]
name = "mission-planner"
path = "src/main.rs"

[[bin]]
name = "mission-server"
path = "src/bin/server.rs"

[dependencies]
body_models         = { path = "../crates/body_models" }
trajectory_solver   = { path = "../crates/trajectory_solver" }
hardware_catalog    = { path = "../crates/hardware_catalog" }
orbital_models      = { path = "../crates/orbital_models" }
ephemeris           = { path = "../crates/ephemeris" }
sim_engine          = { path = "../crates/sim_engine" }
nalgebra            = { workspace = true }
rand                = "~0.8"
hifitime            = "4"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
toml                = "0.8"
clap                = { version = "4", features = ["derive"] }
axum                = { version = "0.7", features = ["json", "ws"] }
tokio               = { version = "1", features = ["full"] }
tower-http          = { version = "0.5", features = ["cors"] }
