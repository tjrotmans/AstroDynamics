# Captured frontend example "mercury" (via POST /api/dev/capture-preset).
# The exact MissionConfig that produced the committed mercury-optimize.json
# preset snapshot -- regenerate that snapshot by POSTing this config to
# /api/optimize on a matching build.

[gnc]
attitude_controller = "ReactionWheelPD"
navigation_filter = "EKF"
pointing_mode = "Nadir"
position_accuracy_req_m = 1000
velocity_accuracy_req_mps = 1

[mission]
name = ""
objective = "Orbit"

[optimization]
departure_body = "Earth"
departure_epoch = "2026-11-12T12:24:49 UTC"
departure_window_days = 90
dv_max_ms = 20000
dv_min_ms = 5000
max_coast_days = 300
method = "GA"
objective = "MinDeltaV"
target_body = "Mercury"

[optimization.force_model]
atol = 0.000000000001
integrator = "Dopri5"
rtol = 0.000000001

[[optimization.force_model.bodies]]
name = "Mercury"
role = "CentralWhenInSoi"

[[optimization.force_model.bodies]]
name = "Sun"
role = "AlwaysThirdBody"

[[optimization.force_model.bodies]]
name = "Venus"
role = "AlwaysThirdBody"

[[optimization.force_model.bodies]]
name = "Earth"
role = "CentralWhenInSoi"

[optimization.ga]
crossover_rate = 0.8
elitism_count = 2
generations = 30
mutation_rate = 0.1
population_size = 100

[optimization.mga]
flyby_bodies = []
leg_tof_days = [[
    30,
    800,
]]

[simulation]
