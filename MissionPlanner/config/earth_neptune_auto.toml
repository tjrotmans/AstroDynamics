# Earth → Neptune flyby via automatic Tisserand beam-search sequence discovery.
#
# The [optimization.mga.sequence_search] section lets the optimizer discover
# intermediate flyby bodies itself instead of the user fixing flyby_bodies.
# Candidate pool includes every major inner AND outer planet, with NO
# uniqueness constraint on repeated visits (the beam search's BeamState
# tracks (body, depth), not a visited-set) — so a real grand-tour or
# resonant-return sequence (e.g. repeated Earth flybys building up energy,
# VEEGA-style, before an outer-planet leg) is a candidate the search can
# actually return, not something excluded by construction.
#
# Real precedent for the two extremes this search space contains:
#   - Voyager 2 (1977): Jupiter→Saturn→Uranus→Neptune grand tour, single visit
#     to each outer planet, no repeats needed once outward energy is high enough.
#   - Rosetta (2004): Earth→Earth→Mars→Earth→Earth (four flybys, three of them
#     Earth) used purely to build up heliocentric energy before the real target —
#     the repeated-single-body pattern this test is checking for is a real,
#     historically-flown strategy, not a search artifact to watch out for.
#
# Reference window: 2031-2034 (~2-3 year departure window), chosen for no
# specific planetary alignment reason — this is an exploratory search, not a
# benchmark against a known solution (see cassini_evvmjs.toml for that).

[mission]
name      = "Earth→Neptune Auto-MGA"
objective = "Flyby"

[target_body]
name          = "Neptune"
mu_m3s2       = 6.836_527_1e15   # matches body_models::TargetBody::neptune()
radius_m      = 24_764_000.0
gravity_model = "PointMass"
atmosphere    = "None"
ephemeris     = "Anise"

[spacecraft]
mass_kg            = 1500.0
dry_mass_kg        = 900.0
propellant_mass_kg = 600.0
bus_dims_m         = [2.5, 2.5, 1.2]
inertia_diag_kgm2  = [300.0, 300.0, 400.0]
srp_model          = "Cannonball"
launch_vehicle     = "AtlasV551Star48"   # high-C3 vehicle needed for an outer-planet departure

[spacecraft.propulsion]
type     = "Biprop"
isp_s    = 320.0
thrust_n = 22.0

[[spacecraft.hardware]]
type           = "ReactionWheelCluster"
model          = "generic"
count          = 4
max_speed_rads = 628.3
max_torque_nm  = 0.05
inertia_kgm2   = 0.006

[[spacecraft.hardware]]
type      = "StarTracker"
noise_rad = 1.5e-4

[[spacecraft.hardware]]
type            = "IMU"
noise_sigma_mps = 0.05

[trajectory]
phases          = ["Cruise"]
solver          = "Lambert"
departure_epoch = "2032-06-01T00:00:00 UTC"
departure_body  = "Earth"

[trajectory.cruise]
tof_days_min    = 2000.0
tof_days_max    = 6000.0
grid_resolution = 30

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "VelocityAligned"
attitude_controller = "ReactionWheelPD"

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-9
atol             = 1.0e-7
dt_truth_s       = 60.0
dt_meas_s        = 600.0
monte_carlo_runs = 0
output_dir       = "out/earth_neptune_auto/"

[optimization]
objective             = "MatchTargetDistance"
method                = "MGA"
departure_body        = "Earth"
target_body           = "Neptune"
departure_epoch       = "2032-06-01T00:00:00 UTC"
departure_window_days = 1095.0   # ~3-year search window
dv_min_ms             = 0.0
dv_max_ms             = 20_000.0
max_coast_days        = 6000.0

[optimization.force_model]
central_body_gravity = "PointMass"
third_bodies         = []
include_srp          = false
integrator           = "DormandPrince45"
rtol                 = 1.0e-9
atol                 = 1.0e-7

[optimization.mga]
# flyby_bodies is ignored when sequence_search is set — auto-discovered below.
flyby_bodies = []
# Per-leg TOF ranges (days). Bounds are indexed by ARRAY POSITION, not by
# "is this the final/outer leg" — mga.rs's `leg_tof_days.get(k)` looks up
# entry k directly for leg k. A short sequence's long outer-planet leg (e.g.
# Jupiter->Neptune, realistically ~2500-3500+ days, cf. Voyager 2's ~10-year
# Jupiter->Neptune cruise) can land at ANY array position depending on how
# many flybys precede it — found after every single beam-search
# candidate came back 100% infeasible: leg index 1 (Jupiter->Neptune for the
# top-ranked 2-leg sequence) was capped at [100, 900] days, geometrically
# impossible for that distance. Fix: every position must be uniformly wide
# enough to cover both a quick inner-system hop AND a full outer-planet
# cruise, since which case applies depends on the discovered sequence length,
# not on position.
leg_tof_days = [
    [80.0, 4000.0],
    [80.0, 4000.0],
    [80.0, 4000.0],
    [80.0, 4000.0],
    [80.0, 4000.0],
    [80.0, 4000.0],
]
departure_vinf_max_ms = 12_000.0   # ambitious but realistic outer-planet departure C3
flyby_min_periapsis_m = 3_500_000.0  # ~100 km above Mars's surface (smallest candidate body)
arrival_vinf_max_ms   = 40_000.0     # Neptune arrivals after a long, high-energy tour are fast
de_f_weight           = 0.8
de_cr                 = 0.9
de_population_size    = 150   # reduced from 400 for a faster exploratory pass
de_generations        = 500   # reduced from 1500
de_restarts           = 2     # reduced from 3

[optimization.mga.sequence_search]
# Every major planet Earth could realistically use as a gravity-assist body
# en route to Neptune — inner planets for resonant energy-building returns,
# outer planets for the classic grand-tour chain.
candidate_bodies  = ["Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus"]
max_legs          = 6      # up to 5 intermediate flybys + final leg to Neptune
beam_width        = 30
max_sequences_to_optimize = 4   # reduced from 8 for a faster exploratory pass
vinf_departure_estimate_ms = 9000.0
