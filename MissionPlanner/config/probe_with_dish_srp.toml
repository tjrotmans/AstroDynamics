# Mars Flyby Probe with a Dish Antenna — Phase 13a Custom Plate Demo
#
# Demonstrates the CustomPlate hardware item: a spacecraft shape
# more complex than a plain box + symmetric panel pair. This probe has a
# high-gain dish antenna offset along +x from the bus, in addition to the
# automatic 6 bus faces and a symmetric ±y solar panel pair. All geometry
# reuses `mars_flyby.toml`'s verified trajectory (Mars flyby, same window) --
# only the spacecraft SRP shape differs, so this config isolates the new
# CustomPlate feature rather than exercising a new trajectory.
#
# The dish is modeled as a single double-sided flat plate (illuminated from
# either face, like a real parabolic dish can be depending on cant angle),
# offset 1.5 m along the bus +x axis from the CoM -- large enough to produce
# a real SRP torque lever arm distinct from the symmetric bus/panel geometry.

[mission]
name      = "Mars Flyby Probe with Dish Antenna"
objective = "Flyby"

# ── Target body ──────────────────────────────────────────────────────────────

[target_body]
name       = "Mars"
mu_m3s2    = 4.282837362069909e13   # Konopliv et al. 2011 (MRO)
radius_m   = 3_396_200.0
gravity_model = "J2J3J4"
atmosphere    = "Exponential"
j2 =  1.96045e-3                    # MRO/MGS gravity solution
j3 =  3.1425e-5
j4 = -1.5385e-5
ephemeris  = "Anise"

# ── Spacecraft ───────────────────────────────────────────────────────────────

[spacecraft]
mass_kg            = 420.0
dry_mass_kg        = 335.0
propellant_mass_kg = 85.0
bus_dims_m         = [1.0, 1.0, 1.2]
inertia_diag_kgm2  = [62.0, 65.0, 41.0]
srp_model          = "FlatPlate"    # exercise build_plates()/CustomPlate, not Cannonball
launch_vehicle     = "Falcon9"

[spacecraft.propulsion]
type     = "Monoprop"
isp_s    = 220.0
thrust_n = 22.0

[[spacecraft.hardware]]
type           = "ReactionWheelCluster"
model          = "generic"
count          = 4
max_speed_rads = 628.3
max_torque_nm  = 0.05
inertia_kgm2   = 0.006

[[spacecraft.hardware]]
type      = "StarTracker"
noise_rad = 1.5e-4

[[spacecraft.hardware]]
type            = "IMU"
noise_sigma_mps = 0.05

[[spacecraft.hardware]]
type                = "OpNavCamera"
bearing_noise_mrad  = 0.1

[[spacecraft.hardware]]
type       = "SolarPanel"
area_m2    = 6.0
efficiency = 0.29

# High-gain dish antenna: 1.2 m^2 double-sided plate, offset 1.5 m along +x
# from the CoM. Optical properties approximate a mesh/graphite-epoxy dish
# (higher specular fraction than the MLI-blanket bus default).
[[spacecraft.hardware]]
type            = "CustomPlate"
normal          = [1.0, 0.0, 0.0]
area_m2         = 1.2
center_offset_m = [1.5, 0.0, 0.0]
rho_s           = 0.45
rho_d           = 0.10
double_sided    = true

# ── Trajectory ───────────────────────────────────────────────────────────────

[trajectory]
phases          = ["Cruise"]
solver          = "Lambert"
departure_epoch = "2026-10-28T00:00:00 UTC"   # same verified window as mars_flyby.toml
departure_body  = "Earth"

[trajectory.cruise]
tof_days_min          = 250.0
tof_days_max          = 380.0
grid_resolution       = 80
departure_window_days = 120.0

# ── GNC ──────────────────────────────────────────────────────────────────────

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "VelocityAligned"
attitude_controller = "ReactionWheelPD"

# ── Simulation ───────────────────────────────────────────────────────────────

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-9
atol             = 1.0e-7
dt_truth_s       = 30.0
dt_meas_s        = 300.0
monte_carlo_runs = 0
output_dir       = "out/probe_with_dish_srp/"
