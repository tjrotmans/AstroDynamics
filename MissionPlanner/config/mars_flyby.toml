# Mars Flyby Mission
# 400 kg probe, monoprop TCMs only (no orbit-insertion burn).
# Demonstrates the Flyby objective + Lambert solver at a real, ANISE-verified window.
#
# Window note: this departure date/TOF was found empirically by scanning a full
# Earth-Mars synodic period (~780 days) with this same Lambert porkchop solver,
# then refining — see mars_orbit.toml for the same verified window used by the
# Orbit objective. Both configs share the window; only the objective/spacecraft
# sizing differ.
#
# Ranking note: `design.rs::best_point_for_objective` ranks Flyby missions by
# minimum C3 alone (no arrival burn exists to charge ΔV against) — fixed
# after the Jupiter case (jupiter_flyby.toml) showed the old
# dep+arrival-ΔV ranking picks a different, worse point for a true flyby.
# This window was re-verified against the corrected ranking: TOF 291.1 days,
# C3 9.18 km²/s² (previously 309.2 days / 9.26 km²/s² under the old, wrong
# ranking — both numbers came from the same window/grid, only the selection
# rule changed).

[mission]
name      = "Mars Flyby"
objective = "Flyby"

# ── Target body ──────────────────────────────────────────────────────────────

[target_body]
name       = "Mars"
mu_m3s2    = 4.282837362069909e13   # Konopliv et al. 2011 (MRO)
radius_m   = 3_396_200.0
gravity_model = "J2J3J4"
atmosphere    = "Exponential"
j2 =  1.96045e-3                    # MRO/MGS gravity solution
j3 =  3.1425e-5
j4 = -1.5385e-5
ephemeris  = "Anise"

# ── Spacecraft ───────────────────────────────────────────────────────────────

[spacecraft]
mass_kg            = 400.0
dry_mass_kg        = 320.0
propellant_mass_kg = 80.0
bus_dims_m         = [1.0, 1.0, 1.2]
inertia_diag_kgm2  = [60.0, 60.0, 40.0]
srp_model          = "Cannonball"
launch_vehicle     = "Falcon9"   # Phase 8c: rocket provides departure C3, not onboard tank

[spacecraft.propulsion]
type     = "Monoprop"
isp_s    = 220.0
thrust_n = 22.0

[[spacecraft.hardware]]
type           = "ReactionWheelCluster"
model          = "generic"
count          = 4
max_speed_rads = 628.3
max_torque_nm  = 0.05
inertia_kgm2   = 0.006

[[spacecraft.hardware]]
type      = "StarTracker"
noise_rad = 1.5e-4

[[spacecraft.hardware]]
type            = "IMU"
noise_sigma_mps = 0.05

[[spacecraft.hardware]]
type                = "OpNavCamera"
bearing_noise_mrad  = 0.1

# ── Trajectory ───────────────────────────────────────────────────────────────

[trajectory]
phases          = ["Cruise"]
solver          = "Lambert"
departure_epoch = "2026-10-28T00:00:00 UTC"   # verified porkchop minimum, de440s.bsp scan
departure_body  = "Earth"

[trajectory.cruise]
tof_days_min          = 250.0
tof_days_max          = 380.0
grid_resolution       = 80
departure_window_days = 120.0

# ── GNC ──────────────────────────────────────────────────────────────────────

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "VelocityAligned"
attitude_controller = "ReactionWheelPD"

# ── Simulation ───────────────────────────────────────────────────────────────

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-9
atol             = 1.0e-7
dt_truth_s       = 30.0
dt_meas_s        = 300.0
monte_carlo_runs = 100
output_dir       = "out/mars_flyby/"
