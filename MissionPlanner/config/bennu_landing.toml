# Bennu Landing Mission
# Demonstrates the Landing objective: deorbit from 3000 m parking orbit,
# free-fall descent, powered-descent handoff at 50 m altitude.
# Physics parameters from Chesley et al. 2020, Scheeres et al. 2020.

[mission]
name = "Bennu Landing"
objective = "Landing"

# ── Target body ──────────────────────────────────────────────────────────────

[target_body]
name       = "Bennu"
mu_m3s2    = 4.89          # Chesley et al. 2020 (Icarus)
radius_m   = 262.0         # Lauretta et al. 2019 (Science)
gravity_model = "J2J3J4"
atmosphere    = "None"
j2 =  1.926101e-2          # Scheeres et al. 2020 (Science Advances)
j3 = -1.221940e-3
j4 = -6.496002e-3
ephemeris  = "Keplerian"

[target_body.keplerian_orbit]
sma_au           = 1.12637
eccentricity     = 0.20375
inclination_deg  = 6.0349
raan_deg         = 2.0829
aop_deg          = 66.2231
mean_anomaly_deg = 218.7
epoch_jd         = 2460486.5

# ── Spacecraft ───────────────────────────────────────────────────────────────

[spacecraft]
mass_kg              = 1000.0
dry_mass_kg          = 800.0
propellant_mass_kg   = 200.0
bus_dims_m           = [2.0, 2.0, 0.63]
inertia_diag_kgm2    = [366.67, 366.67, 666.67]
srp_model            = "Cannonball"
reflectivity_cr      = 1.4

[[spacecraft.hardware]]
type  = "ReactionWheelCluster"
count = 4

[[spacecraft.hardware]]
type  = "RCS"
count = 12

[[spacecraft.hardware]]
type  = "StarTracker"
count = 1

[[spacecraft.hardware]]
type  = "IMU"
count = 1

[[spacecraft.hardware]]
type               = "OpNavCamera"
count              = 1
bearing_noise_mrad = 0.1

[[spacecraft.hardware]]
type          = "Lidar"
count         = 1
range_noise_m = 5.0
max_range_m   = 5000.0

# ── Trajectory ───────────────────────────────────────────────────────────────

[trajectory]
phases         = ["Descent"]
solver         = "Lambert"
departure_epoch = "2026-09-15T00:00:00 UTC"
departure_body  = "Earth"

[trajectory.capture]
target_orbit_radius_m = 3000.0   # parking orbit altitude (deorbit starts here)

[trajectory.landing]
terminal_altitude_m = 50.0       # powered-descent handoff altitude above surface
# deorbit_radius_m not set — defaults to capture.target_orbit_radius_m (3000 m)

# ── GNC ──────────────────────────────────────────────────────────────────────

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "Nadir"
attitude_controller = "ReactionWheelPD"

# ── Simulation ───────────────────────────────────────────────────────────────

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-10
atol             = 1.0e-8
dt_truth_s       = 10.0
dt_meas_s        = 120.0
monte_carlo_runs = 0
output_dir       = "out/bennu_landing/"
