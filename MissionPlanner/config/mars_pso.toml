# Mars PSO — Phase 8j follow-up verification case
# 400 kg probe, same physical setup as mars_flyby.toml/mars_ga.toml — only the
# solver and search box differ.
#
# Verification approach: a particle swarm searching the same deliberately
# wide box as mars_ga.toml (departure ±350 days, TOF 100-600 days) should
# converge to the same minimum mars_flyby.toml's exhaustive grid search and
# mars_ga.toml's GA already found independently (TOF 291.1 days,
# C3 9.18 km²/s², minimizing C3 alone since Flyby has no arrival burn — same
# fitness `best_point_for_objective`/`ga_fitness` use). Converging from a
# different algorithm family (swarm vs. population+crossover) than the GA
# is the actual point of this config, not just re-running the same check.

[mission]
name      = "Mars PSO"
objective = "Flyby"

# ── Target body ──────────────────────────────────────────────────────────────

[target_body]
name       = "Mars"
mu_m3s2    = 4.282837362069909e13   # Konopliv et al. 2011 (MRO)
radius_m   = 3_396_200.0
gravity_model = "J2J3J4"
atmosphere    = "Exponential"
j2 =  1.96045e-3                    # MRO/MGS gravity solution
j3 =  3.1425e-5
j4 = -1.5385e-5
ephemeris  = "Anise"

# ── Spacecraft ───────────────────────────────────────────────────────────────

[spacecraft]
mass_kg            = 400.0
dry_mass_kg        = 320.0
propellant_mass_kg = 80.0
bus_dims_m         = [1.0, 1.0, 1.2]
inertia_diag_kgm2  = [60.0, 60.0, 40.0]
srp_model          = "Cannonball"
launch_vehicle     = "Falcon9"   # Phase 8c: rocket provides departure C3, not onboard tank

[spacecraft.propulsion]
type     = "Monoprop"
isp_s    = 220.0
thrust_n = 22.0

[[spacecraft.hardware]]
type           = "ReactionWheelCluster"
model          = "generic"
count          = 4
max_speed_rads = 628.3
max_torque_nm  = 0.05
inertia_kgm2   = 0.006

[[spacecraft.hardware]]
type      = "StarTracker"
noise_rad = 1.5e-4

[[spacecraft.hardware]]
type            = "IMU"
noise_sigma_mps = 0.05

[[spacecraft.hardware]]
type                = "OpNavCamera"
bearing_noise_mrad  = 0.1

# ── Trajectory ───────────────────────────────────────────────────────────────

[trajectory]
phases          = ["Cruise"]
solver          = "PSO"
departure_epoch = "2026-10-28T00:00:00 UTC"   # same reference epoch as mars_flyby.toml/mars_ga.toml
departure_body  = "Earth"

[trajectory.cruise]
# Same wide search box as mars_ga.toml — see header note.
tof_days_min          = 100.0
tof_days_max          = 600.0
departure_window_days = 700.0

# ── GNC ──────────────────────────────────────────────────────────────────────

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "VelocityAligned"
attitude_controller = "ReactionWheelPD"

# ── Simulation ───────────────────────────────────────────────────────────────

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-9
atol             = 1.0e-7
dt_truth_s       = 30.0
dt_meas_s        = 300.0
monte_carlo_runs = 100
output_dir       = "out/mars_pso/"
