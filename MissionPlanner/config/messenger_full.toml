# GTOP MESSENGER (full) benchmark — real sequence, real bounds where sourced.
#
# Confirmed via the ESA GTOP problem page + a second cross-check
# (arxiv.org/pdf/2010.07517, "GTOPX Space Mission Benchmarks"):
#
#   - Sequence: Earth -> Venus -> Venus -> Mercury -> Mercury -> Mercury -> Mercury
#     (six legs, five intermediate flybys: Venus, Venus, Mercury x3 "resonant"
#     flybys used specifically to shed the large energy needed to reach
#     Mercury's orbit, then final rendezvous at the sixth Mercury encounter).
#     This is a genuine energy-SHEDDING sequence, unlike Cassini-2's
#     energy-GAINING VVEJGA — a good complementary benchmark for exactly
#     that question.
#   - MGA-1DSM model, 26 GTOP decision variables (our own chromosome for a
#     6-leg mission is 32 -- the extra 6 are our leg_model_gene trailing
#     block, a Lambert-rev-count/VILM generalization GTOP's basic
#     formulation doesn't have; decodes to plain 0-rev Lambert to match
#     GTOP's convention).
#   - Best known objective (Schlueter, Wahib, Maruyama, MIDACO solver,
#     15 Sep 2014): 1.959 km/s.
#   - GTOP problem page: https://www.esa.int/gsp/ACT/projects/gtop/messenger_full/
#
# Real, honestly-flagged approximations (same spirit as cassini2_gtop.toml):
#   - Departure epoch/window: GTOP's real t0 bound is [1900, 2300] MJD2000 =
#     2005-03-15 .. 2006-04-19 (converted directly, not approximated).
#     Centered here at the midpoint (2005-10-01) with the full 400-day width
#     as the window. The published-best t0 = 2037.86 MJD2000 = 2005-07-30,
#     inside this window. NOTE this genuinely differs from MESSENGER's real
#     2004-08-03 launch by about a year -- expected, same as Cassini-2's GTOP
#     optimum differing from the real flown Cassini trajectory: GTOP found
#     its OWN best solution within its OWN search bounds, not a reproduction
#     of the historical mission.
#   - Per-leg TOF bounds: GTOP's own table (T1-T6) was only partially legible
#     from the source fetch ("100-600" to "500-600", ambiguous per-leg).
#     Bounds below instead bracket the PUBLISHED BEST decision vector's real
#     per-leg values (T1=451.7, T2=224.7, T3=221.4, T4=266.1, T5=358.0,
#     T6=534.1 days) with real margin on each side -- not GTOP's exact
#     official bounds, but guaranteed to contain the known optimum.
#   - Arrival/objective convention: GTOP describes this as a "rendezvous
#     mission" (matching Mercury's own state, not an orbit-insertion burn at
#     a specific periapsis the way Cassini-2's real eccentric capture is
#     modeled) -- but no target orbit periapsis/eccentricity for a real MOI
#     burn was found in the source. Modeled here as Flyby (final leg priced
#     like every other leg, no separate capture-burn term) as the closest
#     defensible match to GTOP's own decision-vector shape, which has no
#     extra capture-orbit parameter beyond the 26 already accounted for.
#     Revisit if a real target-orbit spec for messenger_full turns up.
#   - rp_norm floor: flyby_min_periapsis_m set to Mercury's own real radius
#     (the tightest body in this sequence -- appears 3 times) rather than
#     Venus's, since the published optimum pins several Mercury flybys right
#     at their periapsis floor (rp3-rp5 = 1.050 body radii each).

[mission]
name      = "MESSENGER full GTOP benchmark (E-V-V-M-M-M-M)"
objective = "Flyby"

[target_body]
name          = "Mercury"
mu_m3s2       = 2.203_208_863e13   # Anderson et al. 2012
radius_m      = 2_439_400.0        # IAU mean radius
gravity_model = "PointMass"
atmosphere    = "None"
ephemeris     = "Anise"

[spacecraft]
mass_kg            = 1_100.0
dry_mass_kg        = 500.0
propellant_mass_kg = 600.0
bus_dims_m         = [1.85, 1.42, 1.27]
inertia_diag_kgm2  = [500.0, 500.0, 500.0]
srp_model          = "Cannonball"

[spacecraft.propulsion]
type     = "Biprop"
isp_s    = 317.0
thrust_n = 645.0

[[spacecraft.hardware]]
type           = "ReactionWheelCluster"
model          = "generic"
count          = 4
max_speed_rads = 628.3
max_torque_nm  = 0.10
inertia_kgm2   = 0.015

[[spacecraft.hardware]]
type      = "StarTracker"
noise_rad = 5.0e-5

[[spacecraft.hardware]]
type            = "IMU"
noise_sigma_mps = 0.02

[trajectory]
phases          = ["Cruise"]
solver          = "Lambert"
departure_epoch = "2005-10-01T00:00:00 UTC"   # midpoint of GTOP's real t0 bound [1900, 2300] MJD2000
departure_body  = "Earth"

[trajectory.cruise]
tof_days_min    = 1_500.0
tof_days_max    = 2_500.0
grid_resolution = 30

[gnc]
navigation_filter   = "EKF"
pointing_mode       = "VelocityAligned"
attitude_controller = "ReactionWheelPD"

[simulation]
integrator       = "DormandPrince45"
rtol             = 1.0e-10
atol             = 1.0e-8
dt_truth_s       = 60.0
dt_meas_s        = 600.0
monte_carlo_runs = 0
output_dir       = "out/messenger_full/"

[optimization]
objective             = "MatchTargetDistance"
method                = "MGA"
departure_body        = "Earth"
target_body           = "Mercury"
departure_epoch       = "2005-10-01T00:00:00 UTC"
departure_window_days = 400.0            # GTOP's real t0 bound width
dv_min_ms             = 0.0
dv_max_ms             = 6_000.0
max_coast_days        = 2_500.0

[optimization.force_model]
central_body_gravity = "PointMass"
third_bodies         = []
include_srp          = false
integrator           = "DormandPrince45"
rtol                 = 1.0e-9
atol                 = 1.0e-7

[optimization.mga]
# Real GTOP MESSENGER-full sequence: Earth -> Venus -> Venus -> Mercury -> Mercury -> Mercury -> Mercury.
flyby_bodies = ["Venus", "Venus", "Mercury", "Mercury", "Mercury"]

# Per-leg TOF ranges (days) -- brackets the published-best vector's real
# per-leg values (see header comment) with margin; not GTOP's exact official
# bounds (only partially legible from the source), but contains the known
# optimum.
leg_tof_days = [
    [200.0, 600.0],   # Earth -> Venus (leg 0, published T1 = 451.7 d)
    [100.0, 400.0],   # Venus -> Venus (leg 1, published T2 = 224.7 d)
    [100.0, 400.0],   # Venus -> Mercury (leg 2, published T3 = 221.4 d)
    [100.0, 450.0],   # Mercury -> Mercury (leg 3, published T4 = 266.1 d)
    [150.0, 550.0],   # Mercury -> Mercury (leg 4, published T5 = 358.0 d)
    [350.0, 650.0],   # Mercury -> Mercury (leg 5, final rendezvous, published T6 = 534.1 d)
]

departure_vinf_min_ms = 2_500.0   # real GTOP bound: v_inf_dep in [2.5, 4.05] km/s
departure_vinf_max_ms = 4_050.0
flyby_min_periapsis_m = 2_439_400.0   # Mercury's own radius (tightest body, appears 3x)
arrival_vinf_max_ms   = 15_000.0
de_f_weight           = 0.8
de_cr                 = 0.9
# Not yet tuned for this problem's real difficulty (32-dim chromosome, 3
# resonant Mercury flybys) -- starting from Cassini-2's benchmark scale.
# Deliberately not run yet, per direct instruction -- revisit budget before
# the first real attempt.
de_population_size    = 250
de_generations        = 600
de_restarts           = 2
